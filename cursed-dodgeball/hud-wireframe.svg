<text x="16" y="530" font-size="10" fill="#fff" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" dominant-baseline="middle">Phone layout, landscape. PC: same HUD, no round buttons; Shift sprint, Q dodge, E ability, M1 throw, M2/F catch, Tab target, C camera.</text>
